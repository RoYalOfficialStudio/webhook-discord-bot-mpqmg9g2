name: Build Windows Installer

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    paths:
      - "music-studio/**"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: music-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone app with PyInstaller
        run: >
          pyinstaller --noconfirm --onedir --windowed --name OfflineMusicStudio
          --collect-all librosa --collect-all resampy --collect-all numba
          --collect-all llvmlite --collect-all soundfile --collect-all sounddevice
          --collect-all scipy --collect-all pydub
          main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineMusicStudioSetup
          path: music-studio/installer_output/OfflineMusicStudioSetup.exe
          if-no-files-found: error
